[tool.poetry]
name = "talentia-backend"
version = "0.1.0"
description = "API TalentIA ATS — SaaS de recrutement assisté par IA (multi-tenant, AI-first)."
authors = ["Équipe TalentIA — DigiScia"]
readme = "README.md"
packages = [{ include = "app" }]
license = "MIT"
keywords = ["ats", "recruitment", "ai", "saas", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
# Core
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.34" }

# Database
sqlalchemy = "^2.0"
alembic = "^1.14"
psycopg = { extras = ["binary"], version = "^3.2" }

# Validation & Settings
pydantic = { extras = ["email"], version = "^2.10" }
pydantic-settings = "^2.7"

# Security
pyjwt = "^2.10"
bcrypt = "^4.2"
python-multipart = "^0.0.20"

# Email
email-validator = "^2.2"
aiosmtplib = "^3.0"

# Redis & Cache
redis = "^5.2"
hiredis = "^3.0"

# Celery (tâches asynchrones)
celery = "^5.4"

# Export
pandas = "^2.2"
openpyxl = "^3.1"

# Monitoring
prometheus-client = "^0.21"

# File handling
python-magic = "^0.4.27"

# Development & Production tools
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
# Linting & Formatting
ruff = "^0.9"
mypy = "^1.15"
black = "^24.12"
isort = "^6.0"

# Testing
pytest = "^8.3"
pytest-cov = "^6.0"
pytest-asyncio = "^0.25"
httpx = "^0.28"
factory-boy = "^3.3"
faker = "^33.1"

# Development
ipython = "^8.29"
watchfiles = "^0.21"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

# ==========================================================
# Ruff Configuration
# ==========================================================

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    "env",
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    # Error detection
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "B",  # flake8-bugbear
    "C",  # flake8-comprehensions
    "UP", # pyupgrade
    
    # Code style
    "I",  # isort
    "W",  # pycodestyle warnings
    "D",  # pydocstyle
    "N",  # pep8-naming
    
    # Security
    "S",  # flake8-bandit
    
    # Performance
    "PERF", # Perflint
    "SIM", # flake8-simplify
    
    # Maintainability
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "TCH", # flake8-type-checking
    "PL",  # pylint
]

ignore = [
    "D100", # Missing module docstring
    "D104", # Missing package docstring
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "D401", # First line of docstring should be in imperative mood
    "S101", # Use of assert detected (for tests)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["fastapi", "sqlalchemy", "alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI patterns are safe
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

# ==========================================================
# MyPy Configuration
# ==========================================================

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "bcrypt.*",
    "prometheus_client.*",
    "celery.*",
    "redis.*",
]
ignore_missing_imports = true

# ==========================================================
# Pytest Configuration
# ==========================================================

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/alembic/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
fail_under = 80

# ==========================================================
# Black Configuration
# ==========================================================

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# ==========================================================
# Isort Configuration
# ==========================================================

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["app"]
known_third_party = ["fastapi", "sqlalchemy", "alembic", "celery", "redis"]

# ==========================================================
# Celery Configuration
# ==========================================================

[tool.celery]
broker_url = "redis://localhost:6379/0"
result_backend = "redis://localhost:6379/0"
task_serializer = "json"
result_serializer = "json"
accept_content = ["json"]
timezone = "UTC"
enable_utc = true

# ==========================================================
# Commandes usuelles (PAS des [tool.poetry.scripts] : Poetry exige une
# cible "module:fonction" et ne sait pas exécuter une commande shell avec
# arguments — les lister ici les rendait invalides et cassait `poetry install`).
# Voir le README pour le détail de chaque commande.
#
#   dev                poetry run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
#   prod               poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000
#   celery-worker      poetry run celery -A app.core.tasks worker --loglevel=info
#   celery-beat        poetry run celery -A app.core.tasks beat --loglevel=info
#   test               poetry run pytest
#   test-cov           poetry run pytest --cov=app --cov-report=html
#   format             poetry run black . && poetry run isort .
#   lint               poetry run ruff check .
#   type-check         poetry run mypy app
#   pre-commit         poetry run ruff check . && poetry run black . && poetry run isort . && poetry run mypy app
#   migrate-create     poetry run alembic revision --autogenerate
#   migrate-upgrade    poetry run alembic upgrade head
#   migrate-downgrade  poetry run alembic downgrade -1
