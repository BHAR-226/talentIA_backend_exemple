services:
  db:
    image: postgres:16-alpine
    container_name: talentia-db
    environment:
      POSTGRES_USER: talentia
      POSTGRES_PASSWORD: talentia
      POSTGRES_DB: talentia
    ports:
      - "5432:5432"
    volumes:
      - talentia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  talentia_pgdata:
