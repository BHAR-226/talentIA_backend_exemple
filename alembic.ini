# ============================================================
# Configuration Alembic pour TalentIA
# ============================================================

[alembic]
# Chemin vers le dossier des migrations
script_location = migrations

# Préfixer le sys.path avec le répertoire courant
prepend_sys_path = .

# Version du schéma de migration
version_path_separator = os  # Utilise os.pathsep

# Utiliser un fichier .env pour la configuration
# La ligne ci-dessous est commentée car la DB URL est chargée dynamiquement
# sqlalchemy.url = postgresql+psycopg://talentia:talentia@localhost:5432/talentia

# Configuration pour la génération automatique des migrations
[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100

# ============================================================
# Configuration des logs
# ============================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# ============================================================
# Configuration pour la génération de migrations
# ============================================================

# Comparer les types de colonnes avec précision
compare_type = True

# Comparer les contraintes de serveur
compare_server_default = True

# Inclure les schémas
# include_schemas = True

# ============================================================
# Configuration des hooks post-migration (optionnel)
# ============================================================

# Exécuter des scripts après chaque migration
# [post_migration_hooks]
# my_hook = my_package.my_module:run_hook